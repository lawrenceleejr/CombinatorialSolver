model:
  d_model: 128
  nhead: 8
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.1
  group_num_layers: 1
training:
  batch_size: 256
  learning_rate: 0.0003
  isr_lr_multiplier: 3.0
  weight_decay: 0.0001
  num_epochs: 8
  warmup_epochs: 1
  restart_period: 0
  patience: 4
  lambda_adv: 0.0
  lambda_adv_rampup: 50
  tf_start: 1.0
  tf_end: 0.3
  tf_decay_epochs: 5
  label_smoothing: 0.1
  lambda_isr: 3.0
  lambda_sym: 0.05
  lambda_sym_rampup: 2
  lambda_qcd: 0.0
  lambda_qcd_rampup: 20
  lambda_entropy_asym: 0.0
  lambda_entropy_asym_rampup: 20
  lambda_entropy_mass: 0.0
  lambda_entropy_mass_rampup: 20
  lambda_bg: 2.0
  lambda_bg_rampup: 2
  beta_bg: 0.5
  bg_soft_weight: 2.0
  bg_asym_cut: 0.0
  lambda_distill: 2.0
  lambda_distill_epochs: 3
  distill_temperature: 4.0
  lambda_isr_direct: 2.0
  lambda_isr_direct_rampup: 3
  phase1_patience: 2
  phase1_max_lr_fraction: 1.0
data:
  normalize_by_ht: true
  num_jets: 7
  pt_smear_frac: 0.0
  data_path: data/*.h5
  qcd_data_path: null
  use_mass_asymmetry_labels: false
