model:
  d_model: 256
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  group_num_layers: 2

training:
  batch_size: 256
  learning_rate: 3.0e-4
  isr_lr_multiplier: 3.0
  weight_decay: 1.0e-4
  num_epochs: 200
  warmup_epochs: 5
  restart_period: 50
  patience: 40
  lambda_adv: 0.0
  lambda_adv_rampup: 50
  tf_start: 1.0
  tf_end: 0.3
  tf_decay_epochs: 100
  # Label smoothing regularizes the cross-entropy loss by distributing a small
  # fraction of the probability mass uniformly across all classes.  With noisy
  # smeared data the "correct" assignment is not always unambiguous, so smoothing
  # prevents overconfident predictions and improves generalization.
  label_smoothing: 0.1
  # Upweights the ISR classification loss relative to the teacher-forced grouping loss.
  # Root cause: signal jets receive gradient from loss_grp_tf via all 10 groupings (10
  # gradient paths per signal jet), while the ISR jet receives gradient only from loss_isr
  # (1 path).  Setting lambda_isr=3 partially compensates for this imbalance without
  # over-dominating the grouping signal.  Tune upward (e.g. 5-10) if ISR still plateaus.
  lambda_isr: 3.0
  lambda_sym: 0.05
  lambda_sym_rampup: 20
  lambda_qcd: 0.1
  lambda_qcd_rampup: 20
  # Entropy-weighted physics prior losses.
  # When the network is uncertain (high output entropy over assignment logits),
  # these losses steer the predicted assignment distribution toward
  # QCD-multijet-like interpretations:
  #   lambda_entropy_asym: maximises entropy-weighted expected mass asymmetry
  #     (|m1-m2|/(m1+m2)).  Minimising drives uncertain events toward
  #     high-asymmetry (non-signal-like) choices.
  #   lambda_entropy_mass: minimises entropy-weighted expected mass sum (m1+m2
  #     in HT-normalised units).  Drives uncertain events toward low-mass
  #     triplet interpretations.
  # These are complementary to lambda_qcd (which uses pT hierarchy as the QCD
  # proxy) because they directly use the network's own uncertainty as the signal.
  # Both default to 0 (disabled); ramp up from Phase 2 start over N epochs like
  # lambda_sym/qcd.  Start with small values (0.05–0.2) and monitor val acc.
  lambda_entropy_asym: 0.1
  lambda_entropy_asym_rampup: 20
  lambda_entropy_mass: 0.05
  lambda_entropy_mass_rampup: 20
  # --- Background (QCD) rejection ---------------------------------------------
  # Requires a QCD sample provided via data.qcd_data_path (or --qcd-data), loaded
  # as background.  For every background event the network is driven to COMMIT to
  # the interpretation that is most obviously not signal-like and duck out of the
  # signal region.  The per-assignment anti-signal score is an OR of two
  # normalised extremes (each in [0,1]): high mass asymmetry, OR low average mass
  # relative to what the event can achieve -- i.e. max(asym, beta_bg * mass_low).
  # Three pieces act on background events only (signal is untouched):
  #   (a) hard cross-entropy toward argmax(anti-signal score) -- commit to the
  #       single most blatantly-non-signal interpretation;
  #   (b) a soft term (bg_soft_weight) maximising the expected anti-signal score
  #       so the *bulk* of the QCD probability moves to the extreme, not just the
  #       argmax;
  #   (c) an optional asymmetry cut (bg_asym_cut) that explicitly evacuates the
  #       signal region by penalising probability left below the cut.
  # Active only when a QCD sample is present (no effect on signal-only runs, where
  # the term is masked out).  Providing a QCD sample with lambda_bg<=0 auto-enables
  # it at 2.0.
  #
  # When training WITH a QCD sample, also set the redundant signal-side proxies to 0:
  #     lambda_qcd: 0.0            # redundant pT-hierarchy proxy; would act on signal
  #     lambda_entropy_asym: 0.0   # ditto (network-uncertainty proxy)
  #     lambda_entropy_mass: 0.0   # ditto
  # (keep lambda_sym so the signal stays a symmetric bump).
  #
  # Tuning for "more extreme" QCD (defaults below are already cranked up and biased
  # toward the asymmetry route):
  #   beta_bg: weight of the low-mass route vs the asymmetry route in the OR
  #     max(asym, beta_bg*mass_low).  1.0 = balanced; <1 favours high asymmetry
  #     (0.5 here); >1 favours low mass.  Lower it further (e.g. 0.3) to lean even
  #     harder on asymmetry.
  #   bg_soft_weight: strength of the distribution-level push that drags the bulk
  #     (not just the argmax) to the extreme.  Raise toward 3-4 to push harder.
  #   lambda_bg: overall weight; raise (e.g. 3-5) to push harder still (watch the
  #     signal accuracy — too high starts to cost reconstruction).
  #   bg_asym_cut: if your signal region is defined by a mass-asymmetry cut
  #     A < A_cut, set this to A_cut (e.g. 0.1) to explicitly evacuate QCD
  #     probability from below the cut.  0 = relative OR push only.
  # The qcd_trends plot draws a dashed "best achievable" line so you can see how
  # much headroom remains before the per-event data limit.
  lambda_bg: 2.0
  lambda_bg_rampup: 20
  beta_bg: 0.5
  bg_soft_weight: 2.0
  bg_asym_cut: 0.0
  # --- Event-level QCD discriminant (requires a QCD sample) --------------------
  # A dedicated event_head (BCE, class-balanced per batch) learns P(QCD|event)
  # from the shared encoder embeddings, giving the analysis an explicit
  # signal-vs-background score to cut on IN ADDITION to the combinatorial
  # self-selection above.  The score is decorrelated from the reconstructed
  # average mass with a DisCo penalty (Kasieczka & Shih, arXiv:2001.05310) on
  # background events, so cutting on it does not sculpt a bump into the QCD
  # m_avg spectrum.  Both auto-enable when a QCD sample is provided; raise
  # lambda_disco (e.g. 5-10) if the post-cut QCD m_avg shows residual shaping.
  lambda_event: 1.0
  lambda_event_rampup: 10
  lambda_disco: 2.0
  lambda_disco_rampup: 10
  # Distillation from the classical mass-asymmetry solver.
  # At Phase 2 epoch 0 this loss pulls the NN logits toward the assignment with
  # the smallest |m1-m2|/(m1+m2).  It decays linearly to zero over
  # lambda_distill_epochs so the labelled CE signal takes over.
  # NOTE: the T² gradient-restoration factor (Hinton 2015) is NOT applied here
  # because the teacher logits are -mass_asym ∈ [-1,0], not NN outputs.  T²
  # would amplify the KL gradient by 16 (T=4), overpowering CE and capping
  # accuracy near random for the full decay period.
  lambda_distill: 2.0
  lambda_distill_epochs: 20
  distill_temperature: 4.0
  # Direct ISR supervision from the flat combined logits.
  # For each ISR candidate j, the score is max_{groupings} logit(isr=j, grp=k),
  # which marginalises over groupings and provides a gradient path through the
  # final combined logits rather than only through the isr_head auxiliary branch.
  # Ramped up linearly over lambda_isr_direct_rampup Phase-2 epochs so that the
  # grouping head has time to stabilise before the direct ISR signal kicks in.
  lambda_isr_direct: 2.0
  lambda_isr_direct_rampup: 10
  # Two-phase training:
  #   Phase 1 — grouping head trained with mass-asymmetry pseudolabels; ISR head frozen.
  #             For each possible ISR choice, the grouping with the lowest mass
  #             asymmetry is used as a CE pseudolabel.  This bypasses the frozen
  #             ISR head and gives a direct gradient to the grouping scorer without
  #             any temperature-sensitivity.  (The KL-distillation approach was
  #             abandoned because mass_asym ∈ [0,1] with T=4 makes the teacher
  #             distribution nearly uniform, yielding ~zero gradient.)
  #             Phase 1 ends when val grp_acc stops improving for phase1_patience epochs.
  #   Phase 2 — full supervised training (CE + ISR + sym + qcd) begins; ISR head
  #             is unfrozen.  Distillation (KL toward classical solver) decays from
  #             lambda_distill_max over lambda_distill_epochs measured from the
  #             Phase 2 start epoch.
  #   Set phase1_patience: 0 to disable two-phase training (legacy behaviour).
  phase1_patience: 10
  # LR cap for Phase 1.  Phase 1 uses a pure 10-class grouping-CE loss (no
  # auxiliary sym/qcd/adversary terms); this simple objective is stable at the
  # full cosine-schedule LR.  Setting phase1_max_lr_fraction: 1.0 lets Phase 1
  # follow the same cosine warmup as Phase 2, so it converges in the 15-20
  # epochs before phase1_patience fires (rather than barely moving off random
  # at the overly-conservative 3e-5 = 0.1 × 3e-4 that was previously used).
  # Reduce below 1.0 only if Phase 1 shows training-loss divergence.
  phase1_max_lr_fraction: 1.0

data:
  normalize_by_ht: true
  num_jets: 7
  pt_smear_frac: 0.20
  # Longitudinal-boost augmentation: each training event is boosted along z by
  # a random rapidity uniform in [-z_boost_aug, +z_boost_aug].  An exact
  # symmetry of the physics (masses and labels unchanged, per-jet pT and hence
  # HT normalisation unchanged) that real events sample via the parton
  # momentum fractions.  Set to 0 to disable.
  z_boost_aug: 1.0
  # Signal sample glob.  Overridden by the --data CLI flag when provided.
  data_path: "data/*.h5"
  # Optional QCD/background sample glob.  When set (and files match), these
  # events are loaded with is_background=True and feed the background-rejection
  # loss (training.lambda_bg) instead of the supervised assignment loss.  They
  # should be MadGraphMLProducer-format h5 with is_signal=0 for every jet and no
  # TARGETS group.  Leave null for signal-only training.
  qcd_data_path: null
  # Compute truth labels as argmin |m1-m2| over all 70 interpretations (recommended).
  # This is the physically correct ground truth for equal-mass pair-produced resonances
  # and removes dependence on potentially incorrect TARGETS entries in the HDF5 file.
  use_mass_asymmetry_labels: true
